version: '3.8'

networks:
  app-network:
    driver: bridge

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      - api

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - app-network
    volumes:
      - ./backend/downloads:/app/downloads  # Mount the downloads directory
      - ./backend/temp:/app/temp
    env_file:
      - ./backend/.env
    environment:
      - GENIUS_TOKEN=${GENIUS_TOKEN}
      - USE_OPENAI=${USE_OPENAI:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://localhost:11434}